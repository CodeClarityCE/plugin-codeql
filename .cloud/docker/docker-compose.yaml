services:
  plugin-codeql:
    build:
      context: ../../backend
      dockerfile: plugins/codeql/.cloud/docker/Dockerfile
      target: plugin-dev
      args:
        - PLUGINNAME=codeql
    image: codeclarityce/codeql-dev:latest
    platform: linux/amd64
    restart: always
    volumes:
      - ../../backend:/codeclarity
      - ../../private:/private
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../../.cloud/env/.env.dev

volumes:
  projects:
